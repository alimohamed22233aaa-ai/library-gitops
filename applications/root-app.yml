apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alimohamed22233aaa-ai/library-gitops.git
    targetRevision: main
    path: applications/apps       
    directory:
      recurse: true
      include: '*.yml'          
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd             
    automated:
      prune: true
      selfHeal: true