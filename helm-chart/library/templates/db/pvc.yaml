apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.db.persistence.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.db.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.db.persistence.size }}
