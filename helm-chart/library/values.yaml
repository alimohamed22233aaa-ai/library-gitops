secret:
  name: library-secret
  postgresUser: library
  postgresPassword: ali123
  postgresDb: library
  secretKey: askjflkjlkcjvmnlsdnlkfjsdkfndsmnvsdwq


db:
  image: postgres:16-alpine
  pgdata: /var/lib/postgresql/data/pgdata
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    size: 5Gi
    storageClassName: manual
    claimName: library-pg-pvc

    createPV: true
    pvName: library-pg-pv
    hostPath: /data/library-pg
    reclaimPolicy: Retain


web:
  replicaCount: 3
  image:
    repository: ghcr.io/alimohamed22233aaa-ai/library-app
    tag: latest
    pullPolicy: Always
  command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "app:app"]
  containerPort: 5000
  service:
    type: NodePort
    port: 5000
    nodePort: 30500
  probePath: /login
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
